<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ NIK TRACKER v2.0 — BRUTAL EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');

        :root {
            --blood: #ff0033;
            --void: #0a0a0a;
            --bone: #e8e8e8;
            --toxic: #ccff00;
            --cyan: #00f0ff;
            --warn: #ffaa00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--void);
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 12px;
            position: relative;
            overflow-x: hidden;
        }

        /* SCANLINE OVERLAY */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.15),
                rgba(0,0,0,0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 9999;
        }

        .main-box {
            width: 100%;
            max-width: 800px;
            background: var(--bone);
            border: 8px solid var(--void);
            box-shadow: 
                16px 16px 0 var(--blood),
                16px 16px 0 4px var(--void);
            position: relative;
            overflow: hidden;
        }

        .main-box::after {
            content: 'BRUTAL_v2.0';
            position: absolute;
            top: -18px;
            right: 20px;
            background: var(--toxic);
            color: var(--void);
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 12px;
            border: 3px solid var(--void);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header {
            background: var(--void);
            padding: 30px 24px;
            border-bottom: 8px solid var(--blood);
            position: relative;
            overflow: hidden;
        }

        .header h1 {
            font-size: clamp(1.8rem, 7vw, 4.5rem);
            font-weight: 800;
            color: var(--bone);
            text-transform: uppercase;
            letter-spacing: -3px;
            line-height: 1;
            position: relative;
            display: inline-block;
        }

        /* GLITCH EFFECT */
        .glitch {
            position: relative;
        }
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 var(--cyan);
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-1 3s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 var(--blood);
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip: rect(20px, 9999px, 15px, 0); }
            20% { clip: rect(60px, 9999px, 70px, 0); }
            40% { clip: rect(20px, 9999px, 5px, 0); }
            60% { clip: rect(80px, 9999px, 50px, 0); }
            80% { clip: rect(10px, 9999px, 40px, 0); }
            100% { clip: rect(50px, 9999px, 20px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(10px, 9999px, 80px, 0); }
            20% { clip: rect(80px, 9999px, 10px, 0); }
            40% { clip: rect(30px, 9999px, 50px, 0); }
            60% { clip: rect(60px, 9999px, 90px, 0); }
            80% { clip: rect(20px, 9999px, 60px, 0); }
            100% { clip: rect(90px, 9999px, 30px, 0); }
        }

        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            background: var(--toxic);
            color: var(--void);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 14px;
            border: 3px solid var(--void);
            text-transform: uppercase;
        }

        .badge.warn {
            background: var(--warn);
        }

        .content {
            padding: 28px 24px;
        }

        .input-section {
            border: 6px dashed var(--void);
            padding: 24px;
            background: repeating-linear-gradient(
                45deg,
                #d0d0d0,
                #d0d0d0 10px,
                #c5c5c5 10px,
                #c5c5c5 20px
            );
            margin-bottom: 24px;
        }

        /* FIX: flex-wrap + min-width 0 biar gak overflow */
        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0;
            border: 6px solid var(--void);
        }

        #nikInput {
            flex: 1 1 auto;
            min-width: 0; /* <-- INI PENTING, biar flex item bisa shrink */
            width: 100%;
            padding: 20px 16px;
            font-size: 1.4rem;
            font-family: inherit;
            font-weight: 700;
            background: #fff;
            border: none;
            outline: none;
            color: var(--void);
            letter-spacing: 2px;
            transition: background 0.1s;
        }

        #nikInput::placeholder {
            color: #999;
            letter-spacing: 2px;
            font-weight: 400;
            font-size: 1.1rem;
        }

        #nikInput:focus {
            background: var(--toxic);
        }

        #nikInput.error {
            background: var(--blood);
            color: #fff;
            animation: shake 0.4s ease-in-out;
        }

        #nikInput.valid {
            background: #00ff88;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        #trackBtn {
            flex: 0 0 auto;
            padding: 20px 36px;
            font-size: 1.5rem;
            font-weight: 800;
            font-family: inherit;
            background: var(--void);
            color: var(--bone);
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.08s;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        #trackBtn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--blood);
            transition: left 0.2s;
            z-index: 0;
        }

        #trackBtn:hover::before {
            left: 0;
        }

        #trackBtn:hover {
            color: #fff;
            transform: translate(-4px, -4px);
            box-shadow: 8px 8px 0 var(--void);
        }

        #trackBtn:active {
            transform: translate(0, 0);
            box-shadow: none;
        }

        #trackBtn span {
            position: relative;
            z-index: 1;
        }

        #trackBtn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #trackBtn:disabled::before {
            display: none;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--void);
            flex-wrap: wrap;
            gap: 4px;
        }

        .counter {
            background: var(--void);
            color: var(--toxic);
            padding: 2px 8px;
            font-size: 0.85rem;
        }

        /* RESULT BOX */
        .result-container {
            border: 6px solid var(--void);
            background: var(--void);
            position: relative;
        }

        .result-header {
            background: var(--blood);
            color: #fff;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        #resultBox {
            padding: 24px;
            min-height: 160px;
            color: var(--toxic);
            font-size: 0.95rem;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: keep-all;
            overflow-wrap: break-word;
            font-family: inherit;
        }

        #resultBox.idle {
            color: #555;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #resultBox.error {
            color: var(--blood);
            background: #1a0000;
        }

        #resultBox.success {
            color: var(--cyan);
            background: #001a1a;
        }

        .copy-btn {
            background: var(--void);
            color: var(--bone);
            border: 3px solid var(--bone);
            padding: 6px 14px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s;
        }

        .copy-btn:hover {
            background: var(--bone);
            color: var(--void);
        }

        .loading-text {
            color: var(--warn);
            animation: blink 0.3s steps(2) infinite;
            font-weight: 800;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
        }

        .footer {
            margin-top: 24px;
            border: 4px solid var(--void);
            background: #fff;
            padding: 16px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--void);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background: var(--toxic);
            border: 2px solid var(--void);
            display: inline-block;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* MARQUEE */
        .marquee-bar {
            background: var(--blood);
            color: #fff;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            overflow: hidden;
            white-space: nowrap;
            border-bottom: 6px solid var(--void);
        }

        .marquee-bar span {
            display: inline-block;
            animation: marquee 10s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* RESPONSIVE: mobile stack */
        @media (max-width: 600px) {
            .main-box::after {
                display: none;
            }
            .content {
                padding: 20px 16px;
            }
            .input-section {
                padding: 16px;
            }
            .input-group {
                flex-direction: column;
            }
            #nikInput {
                width: 100%;
                font-size: 1.2rem;
                padding: 18px 14px;
                letter-spacing: 1px;
            }
            #nikInput::placeholder {
                font-size: 1rem;
            }
            #trackBtn {
                width: 100%;
                padding: 18px;
                font-size: 1.3rem;
            }
            .header {
                padding: 24px 16px;
            }
            .sub-header {
                justify-content: flex-start;
            }
            .result-header {
                padding: 10px 12px;
            }
            #resultBox {
                padding: 16px;
                font-size: 0.9rem;
            }
            .footer {
                padding: 12px;
                justify-content: center;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="main-box">
        <div class="marquee-bar">
            <span>⚠️ SYSTEM BREACH DETECTED — NIK TRACKER v2.0 ONLINE — NO MERCY MODE ACTIVATED ⚠️</span>
        </div>

        <div class="header">
            <h1 class="glitch" data-text="⚡ NIK TRACKER">⚡ NIK TRACKER</h1>
            <div class="sub-header">
                <span class="badge">BRUTAL EDITION</span>
                <span class="badge warn">by @Zaam</span>
            </div>
        </div>

        <div class="content">
            <div class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="nikInput" 
                        placeholder="MASUKKAN NIK" 
                        maxlength="16" 
                        inputmode="numeric"
                        autocomplete="off"
                    >
                    <button id="trackBtn"><span>LACAK</span></button>
                </div>
                <div class="info-bar">
                    <span>FORMAT: 16 DIGIT NUMERIK</span>
                    <span>KARAKTER: <span class="counter" id="charCount">0/16</span></span>
                </div>
            </div>

            <div class="result-container">
                <div class="result-header">
                    <span id="resultTitle">📟 OUTPUT TERMINAL</span>
                    <button class="copy-btn" id="copyBtn" style="display:none;">📋 COPY</button>
                </div>
                <div id="resultBox" class="idle">[ SIAP MELACAK ]</div>
            </div>

            <div class="footer">
                <span><span class="status-dot"></span> ENTITY PRIORITY ONLINE</span>
                <span>OxyX — HANCURKAN BATASAN</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const nikInput = document.getElementById('nikInput');
            const trackBtn = document.getElementById('trackBtn');
            const resultBox = document.getElementById('resultBox');
            const resultTitle = document.getElementById('resultTitle');
            const copyBtn = document.getElementById('copyBtn');
            const charCount = document.getElementById('charCount');

            function escapeHtml(text) {
                if (text === null || text === undefined) return '';
                const div = document.createElement('div');
                div.textContent = String(text);
                return div.innerHTML;
            }

            function formatResult(obj) {
                if (!obj || typeof obj !== 'object') return '⚠️ Format data tidak valid.';
                const lines = [];
                for (const key in obj) {
                    if (obj.hasOwnProperty(key)) {
                        const val = obj[key];
                        if (val !== null && val !== undefined && val !== '') {
                            lines.push(`${escapeHtml(key.toUpperCase())}: ${escapeHtml(val)}`);
                        }
                    }
                }
                return lines.length > 0 ? lines.join('\n') : '⚠️ Data kosong.';
            }

            function validateInput() {
                const raw = nikInput.value;
                const cleaned = raw.replace(/\D/g, '');
                if (raw !== cleaned) {
                    nikInput.value = cleaned;
                }

                const len = cleaned.length;
                charCount.textContent = `${len}/16`;

                nikInput.classList.remove('error', 'valid');
                if (len > 0 && len !== 16) {
                    nikInput.classList.add('error');
                } else if (len === 16) {
                    nikInput.classList.add('valid');
                }
            }

            nikInput.addEventListener('input', validateInput);
            nikInput.addEventListener('paste', function(e) {
                setTimeout(validateInput, 0);
            });

            copyBtn.addEventListener('click', async function() {
                try {
                    await navigator.clipboard.writeText(resultBox.textContent);
                    const original = copyBtn.textContent;
                    copyBtn.textContent = '✅ COPIED!';
                    setTimeout(() => copyBtn.textContent = original, 1500);
                } catch (err) {
                    copyBtn.textContent = '❌ GAGAL';
                    setTimeout(() => copyBtn.textContent = '📋 COPY', 1500);
                }
            });

            async function trackNIK(nik) {
                if (!nik || nik.length !== 16 || !/^\d{16}$/.test(nik)) {
                    resultBox.className = 'error';
                    resultTitle.textContent = '🚨 ERROR';
                    resultBox.textContent = '❌ NIK harus 16 digit angka!';
                    copyBtn.style.display = 'none';
                    nikInput.classList.add('error');
                    setTimeout(() => nikInput.classList.remove('error'), 500);
                    return;
                }

                resultBox.className = '';
                resultTitle.textContent = '⏳ MEMPROSES...';
                resultBox.innerHTML = '<span class="loading-text">>>> MELACAK DATABASE... <<<</span>';
                trackBtn.disabled = true;
                trackBtn.querySelector('span').textContent = '...';
                copyBtn.style.display = 'none';

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);

                try {
                    const response = await fetch('/api/track', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nik: nik }),
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);

                    if (!response.ok) {
                        throw new Error(`Server error: ${response.status} ${response.statusText}`);
                    }

                    const contentType = response.headers.get('content-type');
                    if (!contentType || !contentType.includes('application/json')) {
                        throw new Error('Response bukan JSON. Server mungkin error.');
                    }

                    const data = await response.json();

                    if (data && data.status === 'success') {
                        resultBox.className = 'success';
                        resultTitle.textContent = '✅ DATA DITEMUKAN';
                        resultBox.textContent = formatResult(data.result);
                        copyBtn.style.display = 'inline-block';
                    } else {
                        resultBox.className = 'error';
                        resultTitle.textContent = '⚠️ GAGAL';
                        resultBox.textContent = `❌ ${escapeHtml(data?.message || 'Gagal mengambil data dari server.')}`;
                        copyBtn.style.display = 'none';
                    }

                } catch (err) {
                    resultBox.className = 'error';
                    resultTitle.textContent = '🚨 CRITICAL ERROR';
                    
                    let msg = err.message || 'Terjadi kesalahan.';
                    if (err.name === 'AbortError') {
                        msg = '⏱️ TIMEOUT: Server tidak merespons dalam 10 detik.';
                    } else if (err.message.includes('Failed to fetch')) {
                        msg = '🔌 NETWORK ERROR: Cek koneksi atau endpoint API.\n\nTip: File HTML ini harus dijalankan melalui server (bukan langsung dibuka).';
                    }
                    
                    resultBox.textContent = `🚨 ${escapeHtml(msg)}`;
                    copyBtn.style.display = 'none';
                } finally {
                    trackBtn.disabled = false;
                    trackBtn.querySelector('span').textContent = 'LACAK';
                }
            }

            trackBtn.addEventListener('click', function() {
                trackNIK(nikInput.value.trim());
            });

            nikInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    trackNIK(nikInput.value.trim());
                }
            });

            const urlParams = new URLSearchParams(window.location.search);
            const nikParam = urlParams.get('nik');
            if (nikParam) {
                const cleaned = nikParam.replace(/\D/g, '');
                if (cleaned.length === 16) {
                    nikInput.value = cleaned;
                    validateInput();
                    setTimeout(() => trackNIK(cleaned), 500);
                } else {
                    resultBox.className = 'error';
                    resultBox.textContent = `⚠️ Parameter URL tidak valid: ${escapeHtml(nikParam)}`;
                }
            }
        })();
    </script>
</body>
</html>
