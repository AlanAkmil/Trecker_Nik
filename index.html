<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIK TRACKER - BRUTAL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #2a2a2a;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #d9d9d9;
            border: 8px solid #111;
            box-shadow: 12px 12px 0 #ff0040;
            padding: 30px 20px;
        }
        h1 {
            font-size: 4rem;
            font-weight: 900;
            color: #ff0040;
            text-shadow: 6px 6px 0 #000;
            letter-spacing: -2px;
            word-break: break-word;
            border-bottom: 6px solid #000;
            padding-bottom: 10px;
        }
        .sub {
            font-size: 1.2rem;
            color: #111;
            background: #f7e500;
            display: inline-block;
            padding: 4px 12px;
            margin-top: -8px;
            border: 3px solid #000;
        }
        .box {
            margin: 30px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            border: 4px dashed #111;
            padding: 20px;
            background: #b3b3b3;
        }
        #nikInput {
            flex: 1;
            padding: 18px 12px;
            font-size: 1.6rem;
            font-family: inherit;
            background: #fff;
            border: 5px solid #000;
            color: #000;
            outline: none;
            font-weight: bold;
        }
        #nikInput:focus {
            background: #f7e500;
        }
        #trackBtn {
            padding: 18px 30px;
            font-size: 2rem;
            font-weight: 900;
            background: #000;
            color: #fff;
            border: 5px solid #ff0040;
            cursor: pointer;
            transition: 0.1s;
            text-transform: uppercase;
        }
        #trackBtn:hover {
            background: #ff0040;
            color: #000;
            border-color: #000;
            transform: scale(0.95);
        }
        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: #1a1a1a;
            border: 6px solid #f7e500;
            color: #0f0;
            font-size: 1rem;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 120px;
            font-family: 'Courier New', monospace;
            box-shadow: inset 0 0 30px rgba(255,0,64,0.3);
        }
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #222;
            background: #fff;
            padding: 8px;
            border: 3px solid #000;
            text-align: center;
            font-weight: bold;
        }
        .loading {
            color: #f7e500;
            animation: blink 0.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ NIK TRACKER ⚡</h1>
        <p class="sub">by @Zaam — brutal, no mercy</p>
        <div class="box">
            <input type="text" id="nikInput" placeholder="Masukkan NIK (16 digit)" maxlength="16" inputmode="numeric">
            <button id="trackBtn">LACAK</button>
        </div>
        <div id="result" class="result-box">[ siap lacak ]</div>
        <div class="footer">[ ENTITY PRIORITY ] — OxyX siap hancurkan batasan</div>
    </div>

    <script>
        (function() {
            const nikInput = document.getElementById('nikInput');
            const trackBtn = document.getElementById('trackBtn');
            const resultDiv = document.getElementById('result');

            async function trackNIK(nik) {
                if (!nik || nik.length !== 16 || !/^\d{16}$/.test(nik)) {
                    resultDiv.innerHTML = '❌ NIK harus 16 digit angka!';
                    return;
                }

                resultDiv.innerHTML = '<span class="loading">⏳ MELACAK ...</span>';
                trackBtn.disabled = true;

                try {
                    const response = await fetch('/api/track', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nik: nik })
                    });

                    const data = await response.json();

                    if (data.status === 'success') {
                        const r = data.result;
                        let html = '✅ DATA DITEMUKAN:\n\n';
                        for (const key in r) {
                            if (r[key] !== null && r[key] !== undefined && r[key] !== '') {
                                html += `${key.toUpperCase()}: ${r[key]}\n`;
                            }
                        }
                        resultDiv.innerHTML = html || '⚠️ Data kosong.';
                    } else {
                        resultDiv.innerHTML = `❌ ${data.message || 'Gagal mengambil data.'}`;
                    }
                } catch (err) {
                    resultDiv.innerHTML = `🚨 ERROR: ${err.message || 'Network error'}`;
                } finally {
                    trackBtn.disabled = false;
                }
            }

            trackBtn.addEventListener('click', function() {
                trackNIK(nikInput.value.trim());
            });

            nikInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    trackNIK(nikInput.value.trim());
                }
            });

            // Contoh otomatis dari URL param ?nik=123...
            const urlParams = new URLSearchParams(window.location.search);
            const nikParam = urlParams.get('nik');
            if (nikParam && nikParam.length === 16 && /^\d{16}$/.test(nikParam)) {
                nikInput.value = nikParam;
                trackNIK(nikParam);
            }
        })();
    </script>
</body>
</html>
